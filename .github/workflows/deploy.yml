name: Deploy

# Production is whatever is on main. Pull requests run the same gate but never
# deploy, so a red build blocks the merge instead of blocking the site.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two pushes in quick succession would otherwise race each other to the upload,
# and the loser could land last. Cancel the superseded run instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned for the same reason compatibility_date is pinned in wrangler.jsonc:
      # a toolchain that moves on its own turns an unchanged commit into a
      # different build.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # This one script is the whole gate: vitest over server/, tsc over
      # functions/ and server/ against workers-types, vue-tsc, then vite build.
      # Nothing is uploaded unless all four pass.
      #
      # SITE_URL is a repository variable, not a secret. Left unset the build
      # simply omits canonical/og:url/og:image, which is the documented and
      # correct outcome - a canonical pointing at the wrong host is worse than
      # no canonical at all.
      - run: bun run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # ref_name is main for a push to main, which Cloudflare maps to the
      # production environment. A manual dispatch from any other branch lands
      # as a preview instead, which is what you want from a one-off run.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        run: bunx wrangler pages deploy dist --project-name=portfolio-datnt --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
