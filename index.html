<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nguyen Thanh Dat - Backend Engineer, Laravel and NestJS</title>
    <meta name="description" content="Backend engineer in Da Nang, Vietnam. Five years of PHP and Laravel across ERP, MES, warehouse and healthcare systems, a NestJS service owned solo, and a measured record of turning slow queries into fast ones." />
    <meta name="author" content="Nguyen Thanh Dat" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nguyen Thanh Dat - Backend Engineer, Laravel and NestJS" />
    <meta property="og:description" content="Five years of PHP and Laravel, a NestJS ERP service owned end to end, and a backend team led from inception. I diagnose the slow parts of a system and rebuild them." />
    <meta property="og:image" content="/img/portrait-1200.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <!-- SVG covers every current browser and scales to any tab density; the PNG
         is what iOS uses when the page is saved to a home screen. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The portrait is the LCP element. type gates the whole hint, so a browser
         without WebP skips it and falls through to the <picture> JPEG rather than
         downloading a format it cannot paint. -->
    <link rel="preload" as="image" type="image/webp" href="/img/portrait-1200.webp" imagesrcset="/img/portrait-720.webp 720w, /img/portrait-1200.webp 1200w" imagesizes="(max-width: 1023px) 100vw, 42vw" />
    <script>
      // Applied before paint so the correct theme renders on first frame (no flash).
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.classList.add(t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
